name: Desktop

# Desktop builds (docs/DESKTOP.md), on GitHub's own runners only (this repo is public):
#   - Windows: the Compose Multiplatform app in android/desktop, tested and packaged as an
#     unsigned .msi, uploaded as a workflow artifact for testers. Nothing is published.
#   - Mac: the iOS app built for Mac Catalyst, unsigned, to catch a Mac-only compile failure
#     (a framework that isn't on the Mac) before it reaches main.
# Signing, notarisation and store uploads are not done here; see docs/DESKTOP.md "Release".

on:
  push:
    paths:
      - "android/**"
      - "WSLCRM/**"
      - "WSLCRM.xcodeproj/**"
      - "Config/**"
      - "project.yml"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "android/**"
      - "WSLCRM/**"
      - "WSLCRM.xcodeproj/**"
      - "Config/**"
      - "project.yml"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: wslcrm-desktop-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (and the rendered sign-in screen)
        run: ./gradlew :desktop:test --console=plain

      # jpackage + WiX (fetched by the Compose plugin). Points at int; never a plain-http host.
      - name: Package the .msi (unsigned)
        run: ./gradlew :desktop:packageMsi --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: wslcrm-desktop-windows-msi
          path: |
            android/desktop/build/compose/binaries/main/msi/*.msi
            build/desktop/desktop-compose-signin.png
          retention-days: 14

  mac-catalyst:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Native-only check
        run: scripts/check-native-only.sh

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      - name: Build for Mac Catalyst (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project WSLCRM.xcodeproj \
            -scheme WSLCRM-Int \
            -destination 'platform=macOS,variant=Mac Catalyst' \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
