# XcodeGen spec for WSLCRM. The generated WSLCRM.xcodeproj is committed so the
# project opens without XcodeGen; regenerate with `xcodegen generate` after
# adding targets or changing settings (new source files are picked up
# automatically on regeneration).
name: WSLCRM
options:
  bundleIdPrefix: uk.co.workstation
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

configs:
  Debug-Int: debug
  Release-Int: release
  Debug-DBS-Int: debug
  Release-DBS-Int: release
  Debug-Prod: debug
  Release-Prod: release
  Debug-Local: debug

configFiles:
  Debug-Int: Config/Int.xcconfig
  Release-Int: Config/Int.xcconfig
  Debug-DBS-Int: Config/DBS-Int.xcconfig
  Release-DBS-Int: Config/DBS-Int.xcconfig
  Debug-Prod: Config/Prod.xcconfig
  Release-Prod: Config/Prod.xcconfig
  Debug-Local: Config/Local-API.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_MODULE_VERIFIER: NO
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CLANG_ENABLE_OBJC_WEAK: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  WSLCRM:
    type: application
    platform: iOS
    sources:
      - path: WSLCRM
        # Info plists are selected per configuration via WSLCRM_INFOPLIST_FILE.
        excludes:
          - "Resources/Info*.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.workstation.wslcrm
        PRODUCT_NAME: WSLCRM
        INFOPLIST_FILE: $(WSLCRM_INFOPLIST_FILE)
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(BRAND_NAME)
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Use Face ID to unlock your saved $(BRAND_NAME) session."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Your location is recorded only when you check in to or out of a site visit, as proof of attendance."
        INFOPLIST_KEY_NSCameraUsageDescription: "Take fault and site photos for the job's quote sheet."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Attach existing photos to a job's quote sheet."
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: $(BRAND_APP_ICON)
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    preBuildScripts:
      - name: Validate API base URL
        basedOnDependencyAnalysis: false
        script: |
          if [ -z "${API_BASE_URL}" ]; then
            echo "error: API_BASE_URL is empty for configuration ${CONFIGURATION}. Pass WSLCRM_PROD_API_BASE_URL=https://your-host to xcodebuild, or set it in Config/Prod.local.xcconfig (see README)."
            exit 1
          fi
          case "${API_BASE_URL}" in
            https://*) ;;
            http://127.0.0.1*|http://localhost*)
              if [ "${API_ENVIRONMENT_NAME}" != "Local" ]; then
                echo "error: plain-http API_BASE_URL is only allowed in the Local configuration."; exit 1
              fi ;;
            *) echo "error: API_BASE_URL must start with https:// (got '${API_BASE_URL}')."; exit 1 ;;
          esac

  WSLCRMTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WSLCRMTests
    dependencies:
      - target: WSLCRM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.workstation.wslcrm.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/WSLCRM.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/WSLCRM"
        BUNDLE_LOADER: "$(TEST_HOST)"

  WSLCRMUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WSLCRMUITests
    dependencies:
      - target: WSLCRM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.workstation.wslcrm.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: WSLCRM

schemes:
  WSLCRM-Int:
    build:
      targets:
        WSLCRM: all
        WSLCRMTests: [test]
        WSLCRMUITests: [test]
    run:
      config: Debug-Int
    test:
      config: Debug-Int
      gatherCoverageData: true
      targets:
        - name: WSLCRMTests
        - name: WSLCRMUITests
    profile:
      config: Release-Int
    analyze:
      config: Debug-Int
    archive:
      config: Release-Int
  # The DBS Ltd demo: the int API with the DBS white-label, so the branded build
  # reads the seeded "DBS Group" workspace rather than a local stack.
  WSLCRM-DBS-Int:
    build:
      targets:
        WSLCRM: all
        WSLCRMTests: [test]
        WSLCRMUITests: [test]
    run:
      config: Debug-DBS-Int
    test:
      config: Debug-DBS-Int
      targets:
        - name: WSLCRMTests
        - name: WSLCRMUITests
    profile:
      config: Release-DBS-Int
    analyze:
      config: Debug-DBS-Int
    archive:
      config: Release-DBS-Int
  WSLCRM-Local:
    build:
      targets:
        WSLCRM: all
        WSLCRMTests: [test]
        WSLCRMUITests: [test]
    run:
      config: Debug-Local
    test:
      config: Debug-Local
      targets:
        - name: WSLCRMUITests
    profile:
      config: Debug-Local
    analyze:
      config: Debug-Local
    archive:
      config: Debug-Local
  WSLCRM-Prod:
    build:
      targets:
        WSLCRM: all
    run:
      config: Debug-Prod
    test:
      config: Debug-Prod
      targets:
        - name: WSLCRMTests
    profile:
      config: Release-Prod
    analyze:
      config: Debug-Prod
    archive:
      config: Release-Prod
